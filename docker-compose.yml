services:
  localrevisor:
    build:
      context: .
      args:
        INSTALAR_BERT: ${USE_BERT:-0}
    ports:
      - "5000:5000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      USE_BERT: ${USE_BERT:-0}
    volumes:
      - ./data:/app/data
      - ./modelos:/app/modelos:ro
    restart: unless-stopped