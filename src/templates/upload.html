<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nova correção - localᴚevisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=2) }}" />
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar__leading">
        <a class="icon-button" href="{{ url_for('index') }}" aria-label="Voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z" />
          </svg>
        </a>
        <h1>Nova correção</h1>
      </div>
    </header>

    <main>
      <form class="upload-form" method="post" enctype="multipart/form-data">
        <div class="segmented">
          <label class="segment">
            <input type="radio" name="source" value="file" checked />
            <span>Arquivo</span>
          </label>
          <label class="segment">
            <input type="radio" name="source" value="text" />
            <span>Texto</span>
          </label>
        </div>

        <label class="dropzone" id="dropzone">
          <input id="file" type="file" name="file" accept=".pdf,image/*,.md,.txt" />
          <span class="dropzone__title">Escolher arquivo</span>
          <span class="dropzone__hint">PDF, imagem, Markdown ou texto</span>
        </label>

        <div class="field" id="text-field" hidden>
          <label for="editor">Redação</label>
          <div class="word-editor">
            <div class="word-editor__toolbar" role="toolbar" aria-label="Formatação da redação">
              <button class="word-editor__tool" type="button" data-command="bold" aria-label="Negrito" title="Negrito"><strong>B</strong></button>
              <button class="word-editor__tool" type="button" data-command="italic" aria-label="Itálico" title="Itálico"><em>I</em></button>
              <button class="word-editor__tool" type="button" data-command="underline" aria-label="Sublinhado" title="Sublinhado"><u>U</u></button>
              <span class="word-editor__separator" aria-hidden="true"></span>
              <button class="word-editor__tool" type="button" data-command="justifyLeft" aria-label="Alinhar à esquerda" title="Alinhar à esquerda">⇤</button>
              <button class="word-editor__tool" type="button" data-command="justifyCenter" aria-label="Centralizar" title="Centralizar">↔</button>
              <button class="word-editor__tool" type="button" data-command="justifyRight" aria-label="Alinhar à direita" title="Alinhar à direita">⇥</button>
            </div>
            <div
              class="word-editor__page"
              id="editor"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Escreva sua redação"
              data-placeholder="Comece a escrever sua redação aqui..."
            ></div>
          </div>
          <textarea id="text" name="text" hidden></textarea>
          <span class="field__hint">A formatação é apenas visual; o texto será enviado para correção.</span>
        </div>

        <div class="field">
          <label for="previous-theme">Temas de edições anteriores do ENEM</label>
          <select id="previous-theme">
            <option value="">Escolher um tema anterior (opcional)</option>
            <option value="Perspectivas acerca do envelhecimento na sociedade brasileira">2025 — Perspectivas acerca do envelhecimento na sociedade brasileira</option>
            <option value="Desafios para a valorização da herança africana no Brasil">2024 — Desafios para a valorização da herança africana no Brasil</option>
            <option value="Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil">2023 — Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil</option>
            <option value="Desafios para a valorização de comunidades e povos tradicionais no Brasil">2022 — Desafios para a valorização de comunidades e povos tradicionais no Brasil</option>
            <option value="Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil">2021 — Invisibilidade e registro civil: garantia de acesso à cidadania no Brasil</option>
            <option value="O estigma associado às doenças mentais na sociedade brasileira">2020 — O estigma associado às doenças mentais na sociedade brasileira</option>
            <option value="Democratização do acesso ao cinema no Brasil">2019 — Democratização do acesso ao cinema no Brasil</option>
            <option value="Manipulação do comportamento do usuário pelo controle de dados na internet">2018 — Manipulação do comportamento do usuário pelo controle de dados na internet</option>
            <option value="Desafios para a formação educacional de surdos no Brasil">2017 — Desafios para a formação educacional de surdos no Brasil</option>
            <option value="Caminhos para combater a intolerância religiosa no Brasil">2016 — Caminhos para combater a intolerância religiosa no Brasil</option>
            <option value="A persistência da violência contra a mulher na sociedade brasileira">2015 — A persistência da violência contra a mulher na sociedade brasileira</option>
            <option value="Publicidade infantil em questão no Brasil">2014 — Publicidade infantil em questão no Brasil</option>
          </select>
        </div>

        <div class="form__actions">
          <input
            class="input"
            id="theme"
            name="theme"
            type="text"
            placeholder="Tema"
            aria-label="Tema"
            required
          />
          <button class="button" id="submit" type="submit">Enviar</button>
        </div>
      </form>

      {% if error %}
      <p class="card card--error">{{ error }}</p>
      {% endif %}

      <script>
        const sourceInputs = document.querySelectorAll('input[name="source"]');
        const dropzone = document.getElementById("dropzone");
        const textField = document.getElementById("text-field");
        const textInput = document.getElementById("text");
        const editor = document.getElementById("editor");
        const fileInput = document.getElementById("file");
        const themeInput = document.getElementById("theme");
        const previousTheme = document.getElementById("previous-theme");
        const submitButton = document.getElementById("submit");
        const uploadForm = document.querySelector(".upload-form");
        let editorSelection = null;

        function isTextMode() {
          return document.querySelector('input[name="source"]:checked').value === "text";
        }

        function syncSubmit() {
          const hasContent = isTextMode()
            ? !!textInput.value.trim()
            : !!fileInput.files.length;
          submitButton.disabled = !hasContent || !themeInput.value.trim();
        }

        function syncEditor() {
          textInput.value = editor.innerText;
          syncSubmit();
        }

        function syncSource() {
          dropzone.hidden = isTextMode();
          textField.hidden = !isTextMode();
          syncSubmit();
        }

        sourceInputs.forEach((input) => input.addEventListener("change", syncSource));
        fileInput.addEventListener("change", syncSubmit);
        editor.addEventListener("input", () => {
          editorSelection = null;
          syncEditor();
        });
        themeInput.addEventListener("input", syncSubmit);
        previousTheme.addEventListener("change", () => {
          if (previousTheme.value) {
            themeInput.value = previousTheme.value;
            syncSubmit();
          }
        });
        document.querySelectorAll(".word-editor__tool").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            const selection = window.getSelection();
            if (selection?.rangeCount && editor.contains(selection.anchorNode)) {
              editorSelection = selection.getRangeAt(0).cloneRange();
            }
            event.preventDefault();
          });
          button.addEventListener("click", () => {
            editor.focus();
            if (editorSelection) {
              const selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(editorSelection);
              editorSelection = null;
            }
            document.execCommand(button.dataset.command);
            syncEditor();
          });
        });
        editor.addEventListener("paste", (event) => {
          event.preventDefault();
          const text = event.clipboardData.getData("text/plain");
          document.execCommand("insertText", false, text);
          syncEditor();
        });
        uploadForm.addEventListener("submit", syncEditor);
        syncSource();
      </script>
    </main>
  </body>
</html>
